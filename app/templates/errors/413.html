{% extends "base.html" %}

{% block title %}File Too Large (413) — NatureLens AI{% endblock %}

{% block content %}
<div class="container-xl py-5 text-center">
  <div class="nature-card p-5 max-w-600 mx-auto">
    <div class="badge-icon-wrapper mx-auto mb-3" style="background: #FFF3E0; color: #E65100;">
      <i class="bi bi-file-earmark-arrow-up"></i>
    </div>
    <h2 class="h4 fw-bold text-forest mb-2">Photograph Exceeds Size Limit</h2>
    <p class="text-muted small mb-4">
      The uploaded image exceeds the 16MB limit. Please crop or downscale the photograph and try again.
    </p>
    <a href="{{ url_for('explorer.explorer') }}" class="btn btn-nature-primary btn-sm">
      <i class="bi bi-camera me-1"></i> Try Again
    </a>
  </div>
</div>
{% endblock %}
