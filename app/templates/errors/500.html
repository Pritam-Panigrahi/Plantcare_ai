{% extends "base.html" %}

    <div class="badge-icon-wrapper mx-auto mb-3" style="background: #FFEBEE; color: #C62828;">
      <i class="bi bi-exclamation-triangle"></i>
    </div>

  </div>
</div>
{% endblock %}
