    <path d="M0 -45 Q22 -40 40 -35 M0 -45 Q-22 -40 -40 -35" stroke="#81C784" stroke-width="2" fill="none"/>
    <path d="M0 10 Q25 15 45 20 M0 10 Q-25 15 -45 20" stroke="#81C784" stroke-width="2" fill="none"/>
    <path d="M0 70 Q20 75 30 80 M0 70 Q-20 75 -30 80" stroke="#81C784" stroke-width="2" fill="none"/>
