<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#163A2A" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8D986" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#163A2A" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#B8D986" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Exploration Lens Aperture -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#lensRing)" stroke-width="4.5" stroke-dasharray="18 4 6 4" stroke-linecap="round" />
  
  <!-- Subtle Soft Inner Lens Halo -->
  <circle cx="50" cy="50" r="36" fill="#F5F7F0" fill-opacity="0.9" stroke="#E0E6D8" stroke-width="1.5" />

  <!-- Botanical Leaf Element Forming Lens Core -->
  <path d="M50 18 C68 28, 76 52, 58 74 C50 82, 44 80, 42 76 C32 60, 32 34, 50 18 Z" 
        fill="url(#forestGrad)" filter="url(#glow)" />

  <!-- Accent Leaf Blade with Lime Radiance -->
  <path d="M50 18 C58 28, 62 48, 50 64 C46 54, 46 36, 50 18 Z" 
        fill="url(#limeGrad)" opacity="0.85" />

  <!-- Botanical Leaf Midrib & Vein Details -->
  <path d="M50 20 Q51 46 45 74" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M49 34 Q57 32 62 38" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
  <path d="M48 46 Q56 46 60 52" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
  <path d="M47 58 Q54 58 56 64" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />

  <!-- Lens Aperture Crosshair Markers -->
  <line x1="50" y1="2" x2="50" y2="8" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="92" x2="50" y2="98" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" />
  <line x1="2" y1="50" x2="8" y2="50" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" />
  <line x1="92" y1="50" x2="98" y2="50" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" />

  <!-- Spark of Wonder / Discovery Pip -->
  <circle cx="68" cy="30" r="3" fill="#B8D986" stroke="#163A2A" stroke-width="1" />
</svg>
